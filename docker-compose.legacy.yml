services:
  app:
    environment:
      LEGACY_GROUND_TRUTH_PATH: "${LEGACY_GROUND_TRUTH_PATH:?Set LEGACY_GROUND_TRUTH_PATH to the approved local snapshot}"
    volumes:
      - "${LEGACY_GROUND_TRUTH_PATH}:${LEGACY_GROUND_TRUTH_PATH}:ro"

  worker:
    environment:
      LEGACY_GROUND_TRUTH_PATH: "${LEGACY_GROUND_TRUTH_PATH:?Set LEGACY_GROUND_TRUTH_PATH to the approved local snapshot}"
    volumes:
      - "${LEGACY_GROUND_TRUTH_PATH}:${LEGACY_GROUND_TRUTH_PATH}:ro"

  scheduler:
    environment:
      LEGACY_GROUND_TRUTH_PATH: "${LEGACY_GROUND_TRUTH_PATH:?Set LEGACY_GROUND_TRUTH_PATH to the approved local snapshot}"
    volumes:
      - "${LEGACY_GROUND_TRUTH_PATH}:${LEGACY_GROUND_TRUTH_PATH}:ro"
