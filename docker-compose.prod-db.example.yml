# Copy this file to docker-compose.prod-db.yml when you want the local web app
# to read/debug against the Laravel production database through an SSH tunnel.
#
# 1. Open the tunnel from the Mac host:
#    ssh -N -L 0.0.0.0:3307:youtube-board-db-qcja1i:3306 skyhong.tw
#
# 2. Copy this file and fill DB_USERNAME / DB_PASSWORD in the local copy:
#    cp docker-compose.prod-db.example.yml docker-compose.prod-db.yml
#
# 3. Start only the web app, not worker/scheduler/local mysql:
#    docker compose -f docker-compose.yml -f docker-compose.prod-db.yml up --no-deps app
#
# Do not commit docker-compose.prod-db.yml. It is intentionally gitignored.

services:
  app:
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 3307
      DB_DATABASE: youtube_board
      DB_USERNAME: REPLACE_ME
      DB_PASSWORD: REPLACE_ME
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
      INGESTION_SCHEDULER_ENABLED: "false"
      INGESTION_LOCAL_POLLING_ENABLED: "false"
      INGESTION_PRODUCTION_POLLING_ENABLED: "false"
    depends_on:
      redis:
        condition: service_started

  worker:
    profiles:
      - disabled-prod-db

  scheduler:
    profiles:
      - disabled-prod-db

  phpmyadmin:
    profiles:
      - local-db
