name: youtube-board

x-app: &app
  image: youtube-board-dev
  user: "${UID:-501}:${GID:-20}"
  working_dir: /var/www/html
  volumes:
    - .:/var/www/html
  env_file:
    - path: .env
      required: false
  environment:
    APP_ENV: local
    APP_KEY: "${APP_KEY:-base64:eW91dHViZS1ib2FyZC1sb2NhbC1jb21wb3NlLWtleSE=}"
    APP_DEBUG: "true"
    APP_URL: "${APP_URL:-http://localhost:8080}"
    HOME: /tmp
    COMPOSER_HOME: /tmp/composer
    COMPOSER_CACHE_DIR: /tmp/composer/cache
    NPM_CONFIG_CACHE: /tmp/npm-cache
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: youtube_board
    DB_USERNAME: youtube_board
    DB_PASSWORD: youtube_board
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis
    REDIS_HOST: redis
    LEGACY_PUBLIC_SITE_URL: https://youtube.board.tw
    INGESTION_SCHEDULER_ENABLED: "${INGESTION_SCHEDULER_ENABLED:-true}"
    INGESTION_LOCAL_POLLING_ENABLED: "${INGESTION_LOCAL_POLLING_ENABLED:-false}"
    INGESTION_PRODUCTION_POLLING_ENABLED: "false"
    INGESTION_SCHEDULED_WRITE_ALLOWLIST: "${INGESTION_SCHEDULED_WRITE_ALLOWLIST:-off}"
    INGESTION_LOCK_STORE: "${INGESTION_LOCK_STORE:-redis}"
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_started

services:
  setup:
    <<: *app
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: >-
      sh -ec "git config --global --add safe.directory /var/www/html
      && composer install --no-interaction --prefer-dist
      && npm ci --ignore-scripts
      && npm run build
      && php artisan migrate --force --no-interaction"

  app:
    <<: *app
    depends_on:
      setup:
        condition: service_completed_successfully
    command: php artisan serve --no-reload --host=0.0.0.0 --port=8000
    ports:
      - "${APP_PORT:-8080}:8000"

  worker:
    <<: *app
    depends_on:
      setup:
        condition: service_completed_successfully
    command: php artisan queue:work --sleep=3 --tries=1 --timeout=120

  scheduler:
    <<: *app
    depends_on:
      setup:
        condition: service_completed_successfully
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"

  mysql:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: youtube_board
      MARIADB_USER: youtube_board
      MARIADB_PASSWORD: youtube_board
      MARIADB_ROOT_PASSWORD: youtube_board_root
    ports:
      - "${MYSQL_PORT:-33060}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "${REDIS_FORWARD_PORT:-63790}:6379"

  phpmyadmin:
    image: phpmyadmin:5-apache
    # Debug-only UI: start with `docker compose --profile tools up -d phpmyadmin`.
    profiles: ["tools"]
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: youtube_board
      PMA_PASSWORD: youtube_board
      UPLOAD_LIMIT: 256M
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
